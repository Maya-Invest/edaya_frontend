name: Frontend setup
description: Restore and verify the immutable client, lockfile and source for this run attempt.
inputs:
  source_sha:
    required: true
    description: Immutable frontend commit
  backend_sha:
    required: true
    description: Immutable backend commit
  target:
    required: true
    description: Release environment
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.source_sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: prepared-${{ github.run_id }}-${{ github.run_attempt }}
        path: .
    - name: Restore frozen inputs
      shell: bash
      env:
        CI_SOURCE_SHA: ${{ inputs.source_sha }}
        CI_BACKEND_SHA: ${{ inputs.backend_sha }}
        CI_TARGET: ${{ inputs.target }}
      run: bun run repo ci restore-inputs "$CI_TARGET"
    - name: Restore Bun package cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', '.generated/client.json', '.github/actions/setup/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-
    - name: Install frozen dependencies and verify client
      shell: bash
      env:
        CI_BACKEND_SHA: ${{ inputs.backend_sha }}
      run: |
        bun install --frozen-lockfile --ignore-scripts --force
        bun run repo check client
        bun run repo generate setup
