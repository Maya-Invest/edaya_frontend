name: Setup Bun and Turbo cache
description: Installs Bun, caches dependencies, and enables Turbo remote cache via GitHub Actions cache.

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: 1.3.14
  cache-prefix:
    description: Prefix for Turbo remote cache keys (use a distinct value per repo)
    required: false
    default: edaya-web-turbo-

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Cache for Turbo
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      with:
        cache-prefix: ${{ inputs.cache-prefix }}
        use-relative-cache-path: true
