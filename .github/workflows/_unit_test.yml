name: Unit tests
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      backend_sha:
        type: string
        required: true
      target:
        type: string
        required: true

permissions:
  contents: read
  actions: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      CI_SOURCE_SHA: ${{ inputs.source_ref }}
      CI_BACKEND_SHA: ${{ inputs.backend_sha }}
      CI_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          source_sha: ${{ inputs.source_ref }}
          backend_sha: ${{ inputs.backend_sha }}
          target: ${{ inputs.target }}
      - run: bun run repo test unit
      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage-unit-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .ci-evidence/stages/unit.json
