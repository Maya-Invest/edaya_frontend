name: Smoke test staging

on:
  workflow_call:
    inputs:
      channel:
        description: Deploy channel (smoke runs only for staging)
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.channel == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Smoke test staging SPAs
        run: bun repo smoke-test staging
