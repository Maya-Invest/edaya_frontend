name: Deploy to Cloudflare

on:
  workflow_call:
    inputs:
      app:
        description: App package to deploy (webapp or saas-admin)
        required: true
        type: string
      channel:
        description: API client + deploy channel (staging or production)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v5

      - name: Configure GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Use published API client
        run: node .github/scripts/ci-use-published-api-client.mjs "${{ inputs.channel }}"

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Deploy webapp
        if: inputs.app == 'webapp'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "${{ inputs.channel }}" in
            production) bun --filter @edaya/webapp run deploy:production ;;
            *) bun --filter @edaya/webapp run deploy:staging ;;
          esac

      - name: Deploy saas-admin
        if: inputs.app == 'saas-admin'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "${{ inputs.channel }}" in
            production) bun --filter @edaya/saas-admin run deploy:production ;;
            *) bun --filter @edaya/saas-admin run deploy:staging ;;
          esac
