name: Deploy qualified web build

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      channel:
        required: true
        type: string
      backend_sha:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-bun-turbo
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@maya-invest'
      - name: Consume only the qualified immutable client
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          API_CLIENT_VERSION: 0.0.0-production.${{ inputs.backend_sha }}
          API_CLIENT_SOURCE_COMMIT: ${{ inputs.backend_sha }}
        run: |
          node .github/scripts/ci-use-published-api-client.mjs
          # The publication substitution is temporary and deliberately changes
          # the runner's install specification; the committed lock remains the CI baseline.
          bun install
          bun run contract:check
      - name: Deploy qualified application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          PACKAGE: ${{ inputs.package }}
        run: |
          test "$CHANNEL" = production
          case "$PACKAGE" in
            @edaya/webapp|@edaya/webadmin) bun --filter "$PACKAGE" deploy:production ;;
            *) echo 'Unsupported deployment package' >&2; exit 1 ;;
          esac
