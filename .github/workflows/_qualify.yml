name: Qualification
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      backend_ref:
        type: string
        default: ''
      match_backend_branch:
        type: boolean
        default: false
      full:
        type: boolean
        default: true
      baseline_sha:
        type: string
        default: ''
    secrets:
      BACKEND_CHECKOUT_TOKEN:
        description: Read-only contents access to the private backend repository
        required: true
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  preparation:
    name: Prepare immutable inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      backend_sha: ${{ steps.backend-input.outputs.commit }}
    env:
      CI: 'true'
      CI_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Resolve backend input
        id: backend-input
        env:
          TARGET: ${{ inputs.target }}
          BACKEND_REF: ${{ inputs.backend_ref }}
          MATCH_BRANCH: ${{ inputs.match_backend_branch }}
          BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
        run: bun --no-env-file tooling/repo/ops/backend-input.ts
      - name: Checkout backend input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Maya-Invest/edaya_backend
          ref: ${{ steps.backend-input.outputs.commit }}
          path: .ci/edaya_backend
          token: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
          persist-credentials: false
      - name: Pin backend evidence
        env:
          BACKEND_SHA: ${{ steps.backend-input.outputs.commit }}
        run: echo "CI_BACKEND_SHA=$BACKEND_SHA" >> "$GITHUB_ENV"
      - name: Identify immutable client cache
        id: client-cache
        run: bun run repo ci client-key .ci/edaya_backend
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .cache/clients/
          key: ${{ runner.os }}-client-${{ steps.client-cache.outputs.client_key }}
      - name: Restore Bun package cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-prepare-${{ hashFiles('bun.lock', '.ci/edaya_backend/bun.lock') }}-${{ steps.backend-input.outputs.commit }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Prepare client from checked-out backend
        run: bun run repo generate client "$CI_TARGET" --backend-root .ci/edaya_backend
      - run: bun run repo generate dependencies
      - run: bun run repo ci prepare-inputs "$CI_TARGET"
      - name: Upload frozen inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .generated/
            .release/bun.lock
      - name: Preparation timing
        if: always()
        env:
          STARTED: ${{ steps.source.outputs.started }}
        run: |
          if [ -n "$STARTED" ]; then
            echo "Preparation: $(( $(date +%s) - STARTED ))s" >> "$GITHUB_STEP_SUMMARY"
          fi
  quality:
    needs: preparation
    uses: ./.github/workflows/_quality-check.yml
    with:
      source_ref: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      target: ${{ inputs.target }}
  unit:
    needs: preparation
    uses: ./.github/workflows/_unit-test.yml
    with:
      source_ref: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      target: ${{ inputs.target }}
  build:
    if: inputs.full
    needs: preparation
    uses: ./.github/workflows/_build.yml
    with:
      source_ref: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      target: ${{ inputs.target }}
  integration:
    if: inputs.full
    needs: [preparation, quality, unit]
    uses: ./.github/workflows/_integration-test.yml
    with:
      source_ref: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      target: ${{ inputs.target }}
      baseline_sha: ${{ inputs.baseline_sha }}
    secrets:
      BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
  qualification:
    name: Full validation
    if: ${{ always() && inputs.full }}
    needs: [preparation, quality, unit, build, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      CI_SOURCE_SHA: ${{ needs.preparation.outputs.source_sha }}
      CI_BACKEND_SHA: ${{ needs.preparation.outputs.backend_sha }}
      CI_TARGET: ${{ inputs.target }}
    steps:
      - name: Require every task to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preparation.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          source_sha: ${{ needs.preparation.outputs.source_sha }}
          backend_sha: ${{ needs.preparation.outputs.backend_sha }}
          target: ${{ inputs.target }}
      - uses: ./.github/actions/finalize
        with:
          target: ${{ inputs.target }}
