name: Qualification
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      backend_ref:
        type: string
        default: ''
      match_backend_branch:
        type: boolean
        default: false
      full:
        type: boolean
        default: true
      baseline_sha:
        type: string
        default: ''
    secrets:
      BACKEND_CHECKOUT_TOKEN:
        description: Read-only contents access to the private backend repository
        required: true
permissions:
  contents: read
  deployments: read
jobs:
  qualification:
    name: Full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CI: 'true'
      COMPATIBILITY_BASE_SHA: ${{ inputs.baseline_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Resolve backend input
        id: backend-input
        env:
          TARGET: ${{ inputs.target }}
          BACKEND_REF: ${{ inputs.backend_ref }}
          MATCH_BRANCH: ${{ inputs.match_backend_branch }}
          BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
        run: bun --no-env-file tooling/repo/ops/backend-input.ts
      - name: Checkout backend input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Maya-Invest/edaya_backend
          ref: ${{ steps.backend-input.outputs.commit }}
          path: .ci/edaya_backend
          token: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
          persist-credentials: false
      - name: Pin backend evidence
        env:
          BACKEND_SHA: ${{ steps.backend-input.outputs.commit }}
        run: echo "CI_BACKEND_SHA=$BACKEND_SHA" >> "$GITHUB_ENV"
      - name: Identify immutable client cache
        id: client-cache
        run: bun run repo ci client-key .ci/edaya_backend
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/clients/
          key: ${{ runner.os }}-client-${{ steps.client-cache.outputs.client_key }}
      - name: Prepare client from checked-out backend
        env:
          TARGET: ${{ inputs.target }}
          BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
        run: bun run repo generate client "$TARGET" --backend-root .ci/edaya_backend
      - run: bun run repo generate dependencies
      - run: bun run repo ci setup
      - name: Verify candidate
        env:
          TARGET: ${{ inputs.target }}
        if: inputs.full
        run: bun run repo ci qualify "$TARGET"
      - name: Verify branch
        if: ${{ !inputs.full }}
        run: bun run repo ci verify
      - name: Save frozen build dependencies
        if: inputs.full
        run: bun run repo ci archive-inputs
      - name: Upload qualified candidate
        if: inputs.full
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualified-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .release/
            .generated/
            .ci-evidence/
            apps/webapp/build/
            apps/webadmin/build/
      - name: Upload sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: .ci-evidence/
