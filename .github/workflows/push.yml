name: Branch checks
on:
  push:
    branches-ignore: [main, staging]
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    uses: ./.github/workflows/_qualify.yml
    with:
      target: staging
      backend_ref: ${{ github.ref_name }}
      match_backend_branch: true
      source_ref: ${{ github.sha }}
      full: false
    secrets: inherit
