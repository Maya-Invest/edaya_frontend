name: Deploy qualified artifacts
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Restore exact qualified source and artifacts
        run: bun tooling/repo/ops/restore.ts
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Deploy validated build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run repo ci deploy "$TARGET"
      - name: Upload release evidence and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .release/
