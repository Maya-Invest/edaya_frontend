name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v5

      - name: Prepare backend checkout path
        run: rm -rf edaya_backend

      - name: Checkout backend
        uses: actions/checkout@v5
        with:
          repository: Maya-Invest/edaya_backend
          ref: ${{ github.head_ref || github.ref_name }}
          path: edaya_backend

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Verify
        run: bun run verify
