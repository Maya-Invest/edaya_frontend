name: Push / Merge deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      channel:
        description: Deploy channel
        type: choice
        options: [staging, production]
        default: staging
      backend_ref:
        description: Qualified backend branch, tag or commit
        type: string
        default: ''
      deploy_webapp:
        description: Deploy webapp
        type: boolean
        default: true
      deploy_webadmin:
        description: Deploy webadmin
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
    secrets: inherit

  backend:
    if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'production')
    uses: ./.github/workflows/_backend-candidate.yml
    with:
      backend_ref: ${{ inputs.backend_ref || '' }}
    secrets:
      IDENTITY_CHECKOUT_TOKEN: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}

  integration:
    needs: backend
    if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'production')
    uses: ./.github/workflows/_integration.yml
    with:
      backend_sha: ${{ needs.backend.outputs.backend_sha }}
    secrets:
      IDENTITY_CHECKOUT_TOKEN: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}

  qualification:
    name: Full validation
    needs: [gate, verify, backend, integration]
    if: always() && ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GATE_RESULT: ${{ needs.gate.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require every qualification job to succeed
        run: python3 .github/scripts/ci_support.py gate gate="$GATE_RESULT" verify="$VERIFY_RESULT" backend="$BACKEND_RESULT" integration="$INTEGRATION_RESULT"

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      deploy_webapp: ${{ steps.plan.outputs.deploy_webapp }}
      deploy_webadmin: ${{ steps.plan.outputs.deploy_webadmin }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Direct staging releases to the backend coordinator
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'staging'
        run: |
          echo 'Run edaya_backend Full-stack staging release; use validate_only for preparation.' >&2
          exit 1

      - name: Detect app changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            webapp:
              - apps/webapp/**
              - packages/**
              - vendor/**
              - tooling/**
              - scripts/**
              - release-contract.json
              - package.json
              - bun.lock
              - turbo.json
              - .github/workflows/**
              - .github/actions/**
              - .github/scripts/**
            webadmin:
              - apps/webadmin/**
              - packages/**
              - vendor/**
              - tooling/**
              - scripts/**
              - release-contract.json
              - package.json
              - bun.lock
              - turbo.json
              - .github/workflows/**
              - .github/actions/**
              - .github/scripts/**

      - name: Plan deploy
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            echo "deploy_webapp=${{ inputs.deploy_webapp }}" >> "$GITHUB_OUTPUT"
            echo "deploy_webadmin=${{ inputs.deploy_webadmin }}" >> "$GITHUB_OUTPUT"
          else
            case "$REF_NAME" in
              main|master) CHANNEL=production ;;
              *) CHANNEL=staging ;;
            esac
            echo "deploy_webapp=${{ steps.filter.outputs.webapp == 'true' }}" >> "$GITHUB_OUTPUT"
            echo "deploy_webadmin=${{ steps.filter.outputs.webadmin == 'true' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

  deploy-webapp:
    permissions:
      contents: read
      packages: read
    needs: [gate, qualification, backend]
    if: needs.gate.outputs.channel == 'production' && needs.gate.outputs.deploy_webapp == 'true'
    uses: ./.github/workflows/_deploy-cloudflare.yml
    with:
      package: "@edaya/webapp"
      channel: ${{ needs.gate.outputs.channel }}
      backend_sha: ${{ needs.backend.outputs.backend_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-webadmin:
    permissions:
      contents: read
      packages: read
    needs: [gate, qualification, backend]
    if: needs.gate.outputs.channel == 'production' && needs.gate.outputs.deploy_webadmin == 'true'
    uses: ./.github/workflows/_deploy-cloudflare.yml
    with:
      package: "@edaya/webadmin"
      channel: ${{ needs.gate.outputs.channel }}
      backend_sha: ${{ needs.backend.outputs.backend_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
