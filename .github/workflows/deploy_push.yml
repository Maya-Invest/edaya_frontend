name: Push / Merge deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      channel:
        description: Deploy channel
        type: choice
        options: [staging, production]
        default: staging
      deploy_webapp:
        description: Deploy webapp
        type: boolean
        default: true
      deploy_webadmin:
        description: Deploy webadmin
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      deploy_webapp: ${{ steps.plan.outputs.deploy_webapp }}
      deploy_webadmin: ${{ steps.plan.outputs.deploy_webadmin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect app changes
        uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            webapp:
              - apps/webapp/**
              - packages/**
              - package.json
              - bun.lock
              - turbo.json
              - .github/workflows/**
              - .github/actions/**
              - .github/scripts/**
            webadmin:
              - apps/webadmin/**
              - packages/**
              - package.json
              - bun.lock
              - turbo.json
              - .github/workflows/**
              - .github/actions/**
              - .github/scripts/**

      - name: Plan deploy
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            echo "deploy_webapp=${{ inputs.deploy_webapp }}" >> "$GITHUB_OUTPUT"
            echo "deploy_webadmin=${{ inputs.deploy_webadmin }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.ref_name }}" in
              main|master) CHANNEL=production ;;
              *) CHANNEL=staging ;;
            esac
            echo "deploy_webapp=${{ steps.filter.outputs.webapp == 'true' }}" >> "$GITHUB_OUTPUT"
            echo "deploy_webadmin=${{ steps.filter.outputs.webadmin == 'true' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

  verify:
    needs: gate
    uses: ./.github/workflows/_verify.yml

  deploy-webapp:
    needs: [gate, verify]
    if: >-
      needs.gate.outputs.deploy_webapp == 'true' &&
      needs.verify.result == 'success'
    uses: ./.github/workflows/_deploy-cloudflare.yml
    with:
      package: "@edaya/webapp"
      channel: ${{ needs.gate.outputs.channel }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-webadmin:
    needs: [gate, verify]
    if: >-
      needs.gate.outputs.deploy_webadmin == 'true' &&
      needs.verify.result == 'success'
    uses: ./.github/workflows/_deploy-cloudflare.yml
    with:
      package: "@edaya/webadmin"
      channel: ${{ needs.gate.outputs.channel }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  smoke-test:
    needs: [gate, deploy-webapp, deploy-webadmin]
    if: >-
      needs.gate.outputs.channel == 'staging' &&
      needs.deploy-webapp.result != 'failure' &&
      needs.deploy-webadmin.result != 'failure' &&
      (needs.deploy-webapp.result == 'success' || needs.deploy-webadmin.result == 'success')
    uses: ./.github/workflows/_smoke-test.yml
    with:
      channel: ${{ needs.gate.outputs.channel }}
