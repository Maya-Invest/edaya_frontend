name: Integration tests

on:
  workflow_call:
    inputs:
      api_dev_base_ref:
        description: Base branch used to select the api-dev image channel
        required: true
        type: string

permissions:
  actions: write
  contents: read
  packages: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Resolve API client channel
        id: api_client
        run: |
          CHANNEL="$(node .github/scripts/ci-resolve-api-client-channel.mjs "${{ github.head_ref || github.ref_name }}")"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Using @maya-invest/edaya-api-client@${CHANNEL}"

      - name: Use published API client
        run: node .github/scripts/ci-use-published-api-client.mjs "${{ steps.api_client.outputs.channel }}"

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve api-dev image
        id: api_dev_image
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          case "${{ inputs.api_dev_base_ref }}" in
            main|master) CHANNEL=production ;;
            *) CHANNEL=staging ;;
          esac
          echo "ref=ghcr.io/${OWNER}/edaya-api-dev:${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Resolve api-dev image digest
        id: api_dev_digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ steps.api_dev_image.outputs.ref }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Restore api-dev Docker image cache
        uses: actions/cache@v6
        id: api_dev_image_cache
        with:
          path: /tmp/edaya-api-dev-image.tar
          key: api-dev-image-${{ steps.api_dev_digest.outputs.digest }}

      - name: Load or pull api-dev Docker image
        env:
          IMAGE: ${{ steps.api_dev_image.outputs.ref }}
        run: |
          if [ -f /tmp/edaya-api-dev-image.tar ]; then
            docker load -i /tmp/edaya-api-dev-image.tar
          else
            docker pull "$IMAGE"
            docker save "$IMAGE" -o /tmp/edaya-api-dev-image.tar
          fi

      - name: Start API dev container
        run: bash .github/scripts/ci-api-dev-container.sh start "${{ inputs.api_dev_base_ref }}"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/webapp/package.json', 'bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: apps/webapp
        run: bunx playwright install --with-deps chromium

      - name: Build webapp for integration
        run: |
          bun repo doctor
          PUBLIC_API_URL=http://127.0.0.1:9999 PUBLIC_APP_ENV=staging bun --filter @edaya/webapp build

      - name: Start webapp (Wrangler SPA)
        working-directory: apps/webapp
        run: |
          bun run preview:integration > /tmp/webapp-preview.log 2>&1 &
          echo $! > /tmp/webapp-preview.pid

      - name: Wait for webapp
        run: bash .github/scripts/ci-wait-for-url.sh http://127.0.0.1:4173/login/demo

      - name: Integration tests
        working-directory: apps/webapp
        env:
          INTEGRATION_TARGET: staging
          WEBAPP_URL: http://127.0.0.1:4173
          WEBAPP_READINESS_PATH: /login/demo
        run: bun run test:integration

      - name: Stop webapp
        if: always()
        run: |
          if [ -f /tmp/webapp-preview.pid ]; then
            kill "$(cat /tmp/webapp-preview.pid)" 2>/dev/null || true
          fi

      - name: Stop API dev container
        if: always()
        run: bash .github/scripts/ci-api-dev-container.sh stop
