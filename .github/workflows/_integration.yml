name: Full integration

on:
  workflow_call:
    inputs:
      backend_sha:
        type: string
        required: true
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_BACKEND_SHA: ${{ inputs.backend_sha }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/webapp/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-bun-turbo
      - name: Checkout pinned backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/edaya_backend
          ref: ${{ inputs.backend_sha }}
          path: .ci/edaya_backend
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          persist-credentials: false
      - name: Compare backend source and committed client contracts
        run: python3 .github/scripts/ci_support.py contract --backend .ci/edaya_backend
      - name: Link the unified backend fixture
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          test ! -e "$parent/edaya_backend"
          ln -s "$GITHUB_WORKSPACE/.ci/edaya_backend" "$parent/edaya_backend"
          test -f "$parent/edaya_backend/package/api-client/package.json"
          test -f "$parent/edaya_backend/apps/api/src/identity/entries/testing.ts"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/webapp/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Run all five browser suites and execution checks
        run: bash .github/scripts/run-browser-integration.sh
      - name: Collect credential-free execution evidence
        if: always()
        run: python3 .github/scripts/ci_support.py evidence --role web
      - name: Upload sanitized summaries only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
