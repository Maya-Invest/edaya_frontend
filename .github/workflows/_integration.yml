name: Integration tests

on:
  workflow_call:
    inputs:
      api_dev_base_ref:
        description: Base branch used to select the api-dev image channel
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start API dev container
        run: bash .github/scripts/ci-api-dev-container.sh start "${{ inputs.api_dev_base_ref }}"

      - name: Install Playwright Chromium
        working-directory: apps/webapp
        run: bunx playwright install --with-deps chromium

      - name: Build webapp for integration
        run: |
          bun run prepare:env
          PUBLIC_API_URL=http://127.0.0.1:9999 PUBLIC_APP_ENV=staging bun --filter @edaya/webapp build

      - name: Start webapp preview
        working-directory: apps/webapp
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/webapp-preview.log 2>&1 &
          echo $! > /tmp/webapp-preview.pid

      - name: Wait for webapp preview
        run: bash .github/scripts/ci-wait-for-url.sh http://127.0.0.1:4173/login/demo

      - name: Integration tests
        working-directory: apps/webapp
        env:
          INTEGRATION_TARGET: staging
          WEBAPP_URL: http://127.0.0.1:4173
          WEBAPP_READINESS_PATH: /login/demo
        run: bun run test:integration

      - name: Stop webapp preview
        if: always()
        run: |
          if [ -f /tmp/webapp-preview.pid ]; then
            kill "$(cat /tmp/webapp-preview.pid)" 2>/dev/null || true
          fi

      - name: Stop API dev container
        if: always()
        run: bash .github/scripts/ci-api-dev-container.sh stop
