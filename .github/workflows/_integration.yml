name: Integration tests

on:
  workflow_call:
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: true

permissions:
  actions: write
  contents: read
  packages: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Resolve API client channel
        id: api_client
        run: |
          CHANNEL="$(node .github/scripts/ci-resolve-api-client-channel.mjs "${{ github.head_ref || github.ref_name }}")"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Using @maya-invest/edaya-api-client@${CHANNEL}"

      - name: Use published API client
        run: node .github/scripts/ci-use-published-api-client.mjs "${{ steps.api_client.outputs.channel }}"

      - name: Setup Bun and Turbo cache
        uses: ./.github/actions/ci-bun-turbo

      - name: Resolve API source ref
        id: api_source
        run: |
          WEB_HEAD="${{ github.head_ref || github.ref_name }}"
          REF="$(bash .github/scripts/ci-api-source-ref.sh "$WEB_HEAD")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Using Identity + school @${REF} (web head ${WEB_HEAD})"

      - name: Assert Identity and school refs exist
        env:
          IDENTITY_CHECKOUT_TOKEN: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
        run: bash .github/scripts/ci-assert-sibling-ref.sh "${{ steps.api_source.outputs.ref }}"

      - name: Checkout identity
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/edaya_identity
          ref: ${{ steps.api_source.outputs.ref }}
          path: .ci/edaya_identity
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}

      - name: Checkout school
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/edaya_backend
          ref: ${{ steps.api_source.outputs.ref }}
          path: .ci/edaya_backend
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}

      - name: Link sibling checkouts
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rm -rf "$parent/edaya_identity" "$parent/edaya_backend"
          ln -sfn "$GITHUB_WORKSPACE/.ci/edaya_identity" "$parent/edaya_identity"
          ln -sfn "$GITHUB_WORKSPACE/.ci/edaya_backend" "$parent/edaya_backend"
          test -f "$parent/edaya_identity/package/identity-client/package.json"
          test -f "$parent/edaya_backend/package.json"

      - name: Start empty Identity and school
        run: bash .github/scripts/ci-start-local-apis.sh start

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/webapp/package.json', 'bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: apps/webapp
        run: bunx playwright install --with-deps chromium

      - name: Install Python Excel deps
        run: python3 -m pip install --user openpyxl

      - name: Build webapp for integration
        run: |
          bun repo doctor
          PUBLIC_AUTH_URL=http://127.0.0.1:9900 PUBLIC_API_URL=http://127.0.0.1:9999 PUBLIC_APP_ENV=staging bun --filter @edaya/webapp build

      - name: Start webapp (Wrangler SPA)
        working-directory: apps/webapp
        run: |
          bun run preview:integration > /tmp/webapp-preview.log 2>&1 &
          echo $! > /tmp/webapp-preview.pid

      - name: Wait for webapp
        run: bash .github/scripts/ci-wait-for-url.sh http://127.0.0.1:4173/login

      - name: Provisioned integration tests
        working-directory: apps/webapp
        env:
          AUTH_URL: http://127.0.0.1:9900
          API_URL: http://127.0.0.1:9999
          WEBAPP_URL: http://127.0.0.1:4173
          WEBAPP_READINESS_PATH: /login
        run: bun run test:integration:provisioned

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-run
          path: apps/webapp/.integration-run/
          if-no-files-found: ignore

      - name: Stop webapp
        if: always()
        run: |
          if [ -f /tmp/webapp-preview.pid ]; then
            kill "$(cat /tmp/webapp-preview.pid)" 2>/dev/null || true
          fi

      - name: Stop Identity and school
        if: always()
        run: bash .github/scripts/ci-start-local-apis.sh stop
