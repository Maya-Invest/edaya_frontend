name: CI

on:
  pull_request:
    branches: [main, master, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Verify
        run: bun run verify

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve integration target
        id: target
        run: |
          REF="${{ github.base_ref }}"
          case "$REF" in
            main|master)
              echo "integration_target=production" >> "$GITHUB_OUTPUT"
              echo "webapp_url=https://app.edaya.softilab.dev" >> "$GITHUB_OUTPUT"
              echo "readiness_path=/login" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "integration_target=staging" >> "$GITHUB_OUTPUT"
              echo "webapp_url=https://app-staging.edaya.softilab.dev" >> "$GITHUB_OUTPUT"
              echo "readiness_path=/login/demo" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        working-directory: apps/webapp
        run: bunx playwright install --with-deps chromium

      - name: Wait for deployed webapp
        run: bash .github/scripts/ci-wait-for-url.sh "${{ steps.target.outputs.webapp_url }}${{ steps.target.outputs.readiness_path }}"

      - name: Integration tests
        working-directory: apps/webapp
        env:
          INTEGRATION_TARGET: ${{ steps.target.outputs.integration_target }}
          WEBAPP_URL: ${{ steps.target.outputs.webapp_url }}
          WEBAPP_READINESS_PATH: ${{ steps.target.outputs.readiness_path }}
        run: bun run test:integration
